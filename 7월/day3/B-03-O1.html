<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>모닝브루 — 아침 픽업 예약</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color: #3b2f2f;
      background: #faf8f5;
      line-height: 1.6;
    }

    /* ── Hero ── */
    .hero {
      text-align: center;
      padding: 56px 24px 40px;
      background: linear-gradient(180deg, #fff8f0 0%, #faf8f5 100%);
    }
    .hero h1 {
      font-size: 2rem;
      font-weight: 700;
      margin-bottom: 10px;
      color: #5c3d2e;
    }
    .hero p {
      font-size: 1rem;
      color: #7a6a5e;
      max-width: 420px;
      margin: 0 auto;
    }

    /* ── 데모 안내 배너 ── */
    .demo-banner {
      max-width: 640px;
      margin: 0 auto;
      padding: 12px 24px 0;
    }
    .demo-banner .inner {
      background: #fdf8ee;
      border: 1px solid #f5e8c8;
      border-radius: 12px;
      padding: 12px 16px;
      font-size: 0.85rem;
      color: #a06030;
      text-align: center;
    }

    /* ── Section 공통 ── */
    section { padding: 36px 24px; max-width: 640px; margin: 0 auto; }
    .section-title {
      font-size: 1.25rem;
      font-weight: 700;
      margin-bottom: 20px;
      color: #5c3d2e;
      text-align: center;
    }

    /* ── 예약 폼 ── */
    .form-card {
      background: #fff;
      border-radius: 16px;
      padding: 28px 24px;
      box-shadow: 0 2px 12px rgba(92, 61, 46, 0.08);
    }
    .field { margin-bottom: 18px; }
    .field label {
      display: block;
      font-weight: 600;
      font-size: 0.9rem;
      color: #5c3d2e;
      margin-bottom: 6px;
    }
    .field .optional {
      font-weight: 400;
      color: #b0a090;
      font-size: 0.8rem;
    }
    .field input,
    .field select,
    .field textarea {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid #e8ddd0;
      border-radius: 10px;
      font-size: 1rem;
      font-family: inherit;
      color: #3b2f2f;
      background: #fffdfa;
    }
    .field input:focus,
    .field select:focus,
    .field textarea:focus {
      outline: none;
      border-color: #c4713b;
    }
    .field textarea { resize: vertical; min-height: 64px; }
    .field-row { display: flex; gap: 12px; }
    .field-row .field { flex: 1; }

    /* ── 수량 스테퍼 ── */
    .stepper {
      display: flex;
      align-items: center;
      border: 1.5px solid #e8ddd0;
      border-radius: 10px;
      background: #fffdfa;
      overflow: hidden;
    }
    .stepper-btn {
      width: 40px;
      padding: 11px 0;
      border: none;
      background: none;
      font-size: 1.1rem;
      font-weight: 700;
      color: #c4713b;
      cursor: pointer;
      font-family: inherit;
    }
    .stepper-btn:active { background: #fdf8ee; }
    .stepper-value {
      flex: 1;
      text-align: center;
      font-size: 1rem;
      font-weight: 600;
      color: #3b2f2f;
    }

    .btn {
      display: block;
      width: 100%;
      padding: 16px 24px;
      border: none;
      border-radius: 12px;
      font-size: 1.05rem;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      text-align: center;
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .btn:active { transform: scale(0.97); }
    .btn-primary {
      background: #c4713b;
      color: #fff;
      box-shadow: 0 4px 14px rgba(196, 113, 59, 0.3);
    }

    /* ── 예약 목록 ── */
    .list-area { display: flex; flex-direction: column; gap: 12px; }
    .empty-state {
      background: #fff;
      border: 1.5px dashed #e0d5c5;
      border-radius: 14px;
      padding: 36px 20px;
      text-align: center;
      color: #b0a090;
      font-size: 0.95rem;
    }
    .empty-state .emoji { font-size: 2rem; display: block; margin-bottom: 8px; }

    .booking-card {
      background: #fff;
      border-radius: 14px;
      padding: 18px 20px;
      box-shadow: 0 2px 8px rgba(92, 61, 46, 0.06);
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }
    .booking-info { flex: 1; }
    .booking-info .top {
      display: flex;
      align-items: baseline;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 4px;
    }
    .booking-info .name { font-weight: 700; color: #5c3d2e; }
    .booking-info .time {
      background: #fdf8ee;
      color: #a06030;
      font-size: 0.8rem;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 6px;
    }
    .booking-info .menu { font-size: 0.9rem; color: #6b5b50; }
    .booking-info .note { font-size: 0.82rem; color: #b0a090; margin-top: 2px; }
    .btn-delete {
      background: none;
      border: 1.5px solid #e8ddd0;
      color: #b0a090;
      border-radius: 8px;
      padding: 6px 12px;
      font-size: 0.82rem;
      font-family: inherit;
      cursor: pointer;
      flex-shrink: 0;
    }
    .btn-delete:hover { border-color: #d9534f; color: #d9534f; }

    /* ── Footer ── */
    footer {
      text-align: center;
      padding: 24px;
      font-size: 0.8rem;
      color: #b0a090;
    }

    @media (min-width: 640px) {
      .hero h1 { font-size: 2.4rem; }
    }
  </style>
</head>
<body>

  <!-- 히어로 -->
  <header class="hero">
    <h1>아침 픽업 예약</h1>
    <p>줄 서지 않는 아침. 미리 주문하고, 예약한 시간에 픽업만 하세요.</p>
  </header>

  <!-- 데모 안내 -->
  <div class="demo-banner">
    <div class="inner">
      ⚠️ 화면 연습용 데모입니다 — 입력한 예약은 <strong>새로고침하면 사라집니다.</strong> (저장 기능은 Day 04에서 추가)
    </div>
  </div>

  <!-- 예약 입력 폼 -->
  <section>
    <h2 class="section-title">예약 정보 입력</h2>
    <form class="form-card" id="bookingForm">
      <div class="field-row">
        <div class="field">
          <label for="name">이름</label>
          <input type="text" id="name" placeholder="홍길동">
        </div>
        <div class="field">
          <label for="phone">연락처</label>
          <input type="tel" id="phone" placeholder="010-1234-5678">
        </div>
      </div>
      <div class="field-row">
        <div class="field">
          <label for="menu">메뉴</label>
          <select id="menu">
            <option value="핸드드립 커피 (5,500원)">☕ 핸드드립 커피 (5,500원)</option>
            <option value="오늘의 원두 (4,500원)">🫘 오늘의 원두 (4,500원)</option>
            <option value="수제 스콘 (3,500원)">🥐 수제 스콘 (3,500원)</option>
            <option value="계절 과일 에이드 (6,000원)">🍋 계절 과일 에이드 (6,000원)</option>
          </select>
        </div>
        <div class="field" style="max-width: 140px;">
          <label for="qty">수량 <span class="optional">(최대 3)</span></label>
          <div class="stepper">
            <button type="button" class="stepper-btn" id="qtyMinus">−</button>
            <span class="stepper-value" id="qtyValue">1</span>
            <button type="button" class="stepper-btn" id="qtyPlus">＋</button>
          </div>
        </div>
      </div>
      <div class="field">
        <label for="timeHour">픽업 희망 시간 <span class="optional">(아침 픽업 08:00~10:00)</span></label>
        <div class="field-row">
          <select id="timeHour">
            <option value="08">08시</option>
            <option value="09">09시</option>
            <option value="10">10시</option>
          </select>
          <select id="timeMin"></select>
        </div>
      </div>
      <div class="field">
        <label for="note">요청사항 <span class="optional">(선택)</span></label>
        <textarea id="note" placeholder="예: 얼음 적게, 봉투에 담아주세요"></textarea>
      </div>
      <button type="submit" class="btn btn-primary">📝 픽업 예약하기</button>
    </form>
  </section>

  <!-- 예약 목록 -->
  <section>
    <h2 class="section-title">예약 목록</h2>
    <div class="list-area" id="bookingList"></div>
  </section>

  <footer>
    &copy; 2026 모닝브루 · 화~일 08:00–20:00 · 월요일 휴무
  </footer>

  <script>
    // ── 임시 저장소: 페이지가 열려 있는 동안만 예약을 담는 배열 ──
    // 새로고침하면 초기화됩니다 (오늘의 학습 범위).
    let bookings = [];

    const form = document.getElementById('bookingForm');
    const listEl = document.getElementById('bookingList');
    const hourSelect = document.getElementById('timeHour');
    const minSelect = document.getElementById('timeMin');

    // 픽업 시간: 시(08~10)·분(10분 단위) 분리 선택
    // 마지막 슬롯이 10:00이므로, 10시를 고르면 분은 00만 남긴다
    function renderMinOptions() {
      const isLastHour = hourSelect.value === '10';
      const prev = minSelect.value;
      minSelect.innerHTML = '';
      const minutes = isLastHour ? [0] : [0, 10, 20, 30, 40, 50];
      minutes.forEach(function (m) {
        const mm = String(m).padStart(2, '0');
        const opt = document.createElement('option');
        opt.value = mm;
        opt.textContent = mm + '분';
        minSelect.appendChild(opt);
      });
      // 이전 선택값이 새 목록에도 있으면 유지
      if ([].some.call(minSelect.options, function (o) { return o.value === prev; })) {
        minSelect.value = prev;
      }
    }
    hourSelect.addEventListener('change', renderMinOptions);
    renderMinOptions();

    // ── 수량 스테퍼: 1~3잔 (아침 개인 구매 + 1인 사장 처리량 고려) ──
    let qty = 1;
    const QTY_MIN = 1, QTY_MAX = 3;
    const qtyValueEl = document.getElementById('qtyValue');
    document.getElementById('qtyMinus').addEventListener('click', function () {
      if (qty > QTY_MIN) { qty--; qtyValueEl.textContent = qty; }
    });
    document.getElementById('qtyPlus').addEventListener('click', function () {
      if (qty < QTY_MAX) { qty++; qtyValueEl.textContent = qty; }
    });

    // 폼 제출 → 배열에 추가 → 목록 다시 그리기
    form.addEventListener('submit', function (e) {
      e.preventDefault(); // 페이지 새로고침(기본 동작) 막기

      const booking = {
        id: bookings.length ? bookings[bookings.length - 1].id + 1 : 1,
        name: document.getElementById('name').value,
        phone: document.getElementById('phone').value,
        menu: document.getElementById('menu').value,
        qty: qty,
        time: hourSelect.value + ':' + minSelect.value,
        note: document.getElementById('note').value
      };

      bookings.push(booking);
      form.reset();
      qty = 1; qtyValueEl.textContent = qty; // 스테퍼 초기화
      renderMinOptions(); // 분 선택박스 초기화 (08시 기준으로 복원)
      render();
    });

    // 삭제: 해당 id를 배열에서 제거 → 목록 다시 그리기
    function removeBooking(id) {
      bookings = bookings.filter(function (b) { return b.id !== id; });
      render();
    }

    // 목록 그리기 (배열 → 화면)
    function render() {
      listEl.innerHTML = '';

      // 빈 상태
      if (bookings.length === 0) {
        listEl.innerHTML =
          '<div class="empty-state">' +
          '<span class="emoji">🌅</span>' +
          '아직 예약이 없어요.<br>첫 예약을 기다리고 있습니다!' +
          '</div>';
        return;
      }

      bookings.forEach(function (b) {
        const card = document.createElement('div');
        card.className = 'booking-card';

        const info = document.createElement('div');
        info.className = 'booking-info';
        info.innerHTML =
          '<div class="top">' +
          '<span class="name"></span>' +
          '<span class="time"></span>' +
          '</div>' +
          '<div class="menu"></div>' +
          (b.note ? '<div class="note"></div>' : '');
        info.querySelector('.name').textContent = b.name || '(이름 없음)';
        info.querySelector('.time').textContent = '픽업 ' + b.time;
        info.querySelector('.menu').textContent = b.menu + ' × ' + b.qty + (b.phone ? ' · ' + b.phone : '');
        if (b.note) info.querySelector('.note').textContent = '요청: ' + b.note;

        const del = document.createElement('button');
        del.className = 'btn-delete';
        del.textContent = '삭제';
        del.addEventListener('click', function () { removeBooking(b.id); });

        card.appendChild(info);
        card.appendChild(del);
        listEl.appendChild(card);
      });
    }

    render(); // 첫 화면: 빈 상태 표시
  </script>
</body>
</html>
